<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <title>Eagle Club — Opciones de portada</title>
  <style>
    :root { color-scheme: dark; --wine:#6d1831; --ink:#0a0908; --paper:#f4f0e8; --muted:#b8b0a5; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; max-width:100%; min-height:100%; overflow-x:hidden; background:var(--ink); color:var(--paper); font-family:Arial, Helvetica, sans-serif; }
    button { font:inherit; }
    .app { width:100%; max-width:100vw; min-height:100svh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow-x:hidden; }
    header { height:84px; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:16px clamp(18px,4vw,64px); border-bottom:1px solid #ffffff20; }
    header img { width:72px; height:52px; object-fit:contain; }
    .heading { flex:1; }
    .eyebrow { margin:0 0 5px; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
    h1 { margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:clamp(20px,2.4vw,32px); font-weight:400; }
    .counter { min-width:76px; text-align:right; font-size:13px; letter-spacing:.12em; color:var(--muted); }
    .stage { position:relative; min-height:0; overflow:hidden; background:#050505; }
    .photo-backdrop { position:absolute; inset:-32px; width:calc(100% + 64px); height:calc(100% + 64px); object-fit:cover; filter:blur(28px) brightness(.42) saturate(.8); opacity:0; transform:scale(1.06); transition:opacity .45s ease; }
    .photo-backdrop.active { opacity:1; }
    .photo { position:absolute; z-index:1; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transform:scale(1.005); transition:opacity .45s ease, transform 1.1s ease; }
    .photo.active { opacity:1; transform:scale(1); }
    .shade { position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,#00000012 45%,#000000d9 100%); }
    .caption { position:absolute; z-index:2; left:clamp(22px,5vw,76px); right:clamp(22px,5vw,76px); bottom:clamp(24px,5vw,66px); max-width:720px; }
    .number { margin-bottom:10px; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#ded6c9; }
    .title { margin:0 0 8px; font-family:Georgia, 'Times New Roman', serif; font-size:clamp(32px,5vw,68px); line-height:.95; font-weight:400; }
    .description { margin:0; max-width:540px; color:#ddd6cb; font-size:clamp(13px,1.3vw,16px); line-height:1.45; }
    .nav { position:absolute; z-index:3; top:50%; width:52px; height:52px; border:1px solid #ffffff60; border-radius:50%; background:#09080780; color:white; cursor:pointer; backdrop-filter:blur(8px); transform:translateY(-50%); transition:.2s ease; }
    .nav:hover { background:var(--wine); border-color:var(--wine); }
    .prev { left:clamp(12px,2vw,30px); } .next { right:clamp(12px,2vw,30px); }
    .favorite { position:absolute; z-index:3; top:22px; right:clamp(18px,3vw,42px); border:1px solid #ffffff55; background:#0908078c; color:white; padding:11px 15px; cursor:pointer; letter-spacing:.08em; font-size:11px; text-transform:uppercase; backdrop-filter:blur(8px); }
    .favorite.selected { background:var(--wine); border-color:var(--wine); }
    footer { width:100%; min-width:0; max-width:100%; overflow:hidden; padding:14px clamp(18px,4vw,64px) 18px; border-top:1px solid #ffffff20; }
    .footer-top { min-width:0; display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:12px; }
    .hint { margin:0; color:var(--muted); font-size:11px; letter-spacing:.08em; }
    .copy { border:0; background:transparent; color:#eee6dc; padding:6px 0; cursor:pointer; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
    .thumbs { display:grid; width:100%; min-width:0; max-width:100%; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; overflow:hidden; padding-bottom:4px; }
    .thumb { position:relative; width:100%; height:auto; aspect-ratio:16 / 9; padding:0; border:1px solid transparent; background:#181614; cursor:pointer; opacity:.5; overflow:hidden; transition:.2s ease; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb span { position:absolute; left:5px; bottom:4px; min-width:19px; height:19px; padding:3px; background:#000b; font-size:10px; }
    .thumb.active { opacity:1; border-color:#fff; }
    .thumb.fav::after { content:'★'; position:absolute; top:4px; right:5px; color:#fff; text-shadow:0 1px 4px #000; }
    @media (max-width:700px) {
      header { height:72px; padding-block:12px; } header img { width:56px; height:42px; }
      .counter { min-width:54px; } .stage { min-height:58svh; }
      .nav { width:42px; height:42px; top:45%; } .caption { bottom:28px; }
      .description { max-width:82%; } .favorite { top:14px; right:14px; }
      .hint { display:none; } .footer-top { justify-content:flex-end; margin-bottom:8px; }
      footer { padding-inline:12px; } .thumbs { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <img src="../media/eagleclub-logo-stacked.png" alt="Eagle Club">
      <div class="heading"><p class="eyebrow">Selección visual · Home</p><h1>40 opciones de portada</h1></div>
      <div class="counter" id="counter">01 / 40</div>
    </header>
    <section class="stage" id="stage" aria-live="polite">
      <div id="photos"></div><div class="shade"></div>
      <button class="nav prev" id="prev" aria-label="Anterior">←</button>
      <button class="nav next" id="next" aria-label="Siguiente">→</button>
      <button class="favorite" id="favorite">☆ Marcar favorita</button>
      <div class="caption"><div class="number" id="number"></div><h2 class="title" id="title"></h2><p class="description" id="description"></p></div>
    </section>
    <footer>
      <div class="footer-top"><p class="hint">Usa ← → o desliza para navegar · Puedes marcar varias favoritas</p><button class="copy" id="copy">Copiar selección</button></div>
      <div class="thumbs" id="thumbs"></div>
    </footer>
  </main>
  <script>
    const slides = [
      ['option-01-current.jpg','Actual','La fotografía que está hoy publicada en el inicio.'],
      ['option-02-grand-bay-v2.jpg','The Grand Bay','El simulador como protagonista, con señalética Eagle Club integrada.'],
      ['option-03-members-lounge-v2.jpg','Members Lounge','Una mirada cálida al club privado con placa de marca en latón.'],
      ['option-04-golfer-swing-v2.jpg','The Swing','Acción deportiva y una identidad visual protagonista.'],
      ['option-05-social-night-v2.jpg','Social Night','Juego, amigos y marca en una atmósfera social nocturna.'],
      ['option-06-technology-v2.jpg','Precision','Tecnología y detalle con el emblema aplicado al equipamiento.'],
      ['option-07-reception-v2.jpg','The Arrival','Una recepción de marca clara, elegante y memorable.'],
      ['option-08-bar-and-bays-v2.jpg','Bar & Bays','Bar, lounge y golf con identidad grabada en metal.'],
      ['option-09-after-work-v2.jpg','After Work','Una propuesta ejecutiva con branding textil en burdeo.'],
      ['option-10-dark-bay-v2.jpg','Pure Golf','Minimalismo y una proyección luminosa del emblema Eagle Club.'],
      ['option-11-warm-architecture-v2.jpg','Warm Clubhouse','Travertino, madera y marca tallada en la arquitectura.'],
      ['option-12-burgundy-lounge-v2.jpg','The Burgundy Room','Una identidad íntima y nocturna centrada en el color de marca.'],
      ['option-13-woman-golfer-v2.jpg','Focused','Una imagen deportiva y moderna con señalética vertical.'],
      ['option-14-corporate-event-v2.jpg','Team Night','Eagle Club como escenario para equipos, eventos y celebraciones.'],
      ['option-15-gastronomy-v2.jpg','Golf & Gastronomy','La experiencia culinaria con aplicaciones sutiles de marca.'],
      ['option-16-putting-lounge-v2.jpg','Practice Lounge','Entrenamiento y escultura de marca en un gran putting green.'],
      ['option-17-panoramic-club-v2.jpg','The Club','La propuesta completa con un emblema suspendido como punto focal.'],
      ['option-18-ball-detail-v2.jpg','The Detail','Una portada gráfica con el emblema aplicado directamente a la pelota.'],
      ['option-19-santiago-view-v2.jpg','Santiago Blue Hour','Golf indoor, ciudad, cordillera y marca sobre el cristal.'],
      ['option-20-passage-v2.jpg','The Passage','Una llegada cinematográfica guiada por el emblema iluminado.'],
      ['option-21-rooftop-santiago.jpg','Rooftop Santiago','Un pabellón de golf sobre la ciudad al atardecer.'],
      ['option-22-vineyard.jpg','Chilean Vineyard','Arquitectura contemporánea conectada con una viña chilena.'],
      ['option-23-japanese-minimal.jpg','Zen Bay','Calma, madera clara y paisajismo japonés alrededor del juego.'],
      ['option-24-industrial-loft.jpg','Industrial Loft','Ladrillo, acero y energía social en un gran loft urbano.'],
      ['option-25-performance-lab.jpg','Performance Lab','Una visión luminosa y tecnológica del entrenamiento de alto nivel.'],
      ['option-26-art-deco.jpg','Art Deco Night','Una interpretación glamorosa, geométrica y nocturna del club.'],
      ['option-27-botanical.jpg','Botanical Club','Golf indoor dentro de un invernadero sofisticado y lleno de luz.'],
      ['option-28-wine-cellar.jpg','Wine Cellar','Golf, vino chileno y hospitalidad dentro de una cava contemporánea.'],
      ['option-29-library.jpg','The Library','Un club silencioso y culto con el simulador oculto entre libros.'],
      ['option-30-private-cinema.jpg','Private Cinema','El juego convertido en espectáculo dentro de una sala de cine.'],
      ['option-31-art-gallery.jpg','Golf as Art','Una instalación de golf en una galería contemporánea.'],
      ['option-32-bunker.jpg','The Bunker','Hormigón brutalista, niebla y una experiencia deportiva intensa.'],
      ['option-33-black-marble.jpg','Black Marble','Una suite escultórica, minimalista y completamente arquitectónica.'],
      ['option-34-scandinavian.jpg','Daylight Club','Una alternativa clara, fresca y cercana con diseño escandinavo.'],
      ['option-35-chefs-table.jpg','Chef’s Table','Cocina abierta y golf conviviendo en una experiencia dinámica.'],
      ['option-36-trophy-vault.jpg','Trophy Vault','Historia del golf y objetos de colección presentados como joyas.'],
      ['option-37-morning-coffee.jpg','Morning Club','La experiencia Eagle Club desde el café de primera hora.'],
      ['option-38-locker-room.jpg','Members’ Locker Room','Una imagen editorial centrada en pertenencia y preparación.'],
      ['option-39-andes-chalet.jpg','Andes Chalet','Un refugio invernal de piedra y madera frente a la cordillera.'],
      ['option-40-tournament-arena.jpg','The Final','Eagle Club convertido en una gran final con público y espectáculo.']
    ];
    const root = '../media/hero-options/';
    const photos = document.querySelector('#photos'), thumbs = document.querySelector('#thumbs');
    const title = document.querySelector('#title'), description = document.querySelector('#description');
    const number = document.querySelector('#number'), counter = document.querySelector('#counter');
    const favorite = document.querySelector('#favorite');
    let current = 0, startX = 0;
    const favorites = new Set(JSON.parse(localStorage.getItem('eagle-hero-favorites') || '[]'));
    slides.forEach((slide, i) => {
      const backdrop = new Image(); backdrop.src = root + slide[0]; backdrop.alt = ''; backdrop.className = 'photo-backdrop'; if (!i) backdrop.classList.add('active'); photos.append(backdrop);
      const image = new Image(); image.src = root + slide[0]; image.alt = slide[1]; image.className = 'photo'; if (!i) image.classList.add('active'); photos.append(image);
      const button = document.createElement('button'); button.className = 'thumb' + (!i ? ' active' : '') + (favorites.has(i) ? ' fav' : ''); button.innerHTML = `<img src="${root+slide[0]}" alt=""><span>${String(i+1).padStart(2,'0')}</span>`; button.onclick = () => show(i); thumbs.append(button);
    });
    function show(index) {
      current = (index + slides.length) % slides.length;
      document.querySelectorAll('.photo-backdrop').forEach((el,i) => el.classList.toggle('active', i === current));
      document.querySelectorAll('.photo').forEach((el,i) => el.classList.toggle('active', i === current));
      document.querySelectorAll('.thumb').forEach((el,i) => el.classList.toggle('active', i === current));
      const n = String(current + 1).padStart(2,'0'); number.textContent = `Opción ${n}`; counter.textContent = `${n} / ${slides.length}`;
      title.textContent = slides[current][1]; description.textContent = slides[current][2];
      favorite.textContent = favorites.has(current) ? '★ Favorita' : '☆ Marcar favorita'; favorite.classList.toggle('selected', favorites.has(current));
    }
    document.querySelector('#prev').onclick = () => show(current - 1); document.querySelector('#next').onclick = () => show(current + 1);
    favorite.onclick = () => { favorites.has(current) ? favorites.delete(current) : favorites.add(current); localStorage.setItem('eagle-hero-favorites', JSON.stringify([...favorites])); document.querySelectorAll('.thumb')[current].classList.toggle('fav', favorites.has(current)); show(current); };
    document.querySelector('#copy').onclick = async (event) => { const text = favorites.size ? `Mis opciones favoritas para la portada de Eagle Club: ${[...favorites].sort((a,b)=>a-b).map(i=>`${String(i+1).padStart(2,'0')} — ${slides[i][1]}`).join(', ')}` : 'Aún no he marcado opciones favoritas.'; await navigator.clipboard.writeText(text); event.currentTarget.textContent='Selección copiada ✓'; setTimeout(()=>event.currentTarget.textContent='Copiar selección',1800); };
    document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(current - 1); if (e.key === 'ArrowRight') show(current + 1); });
    document.querySelector('#stage').addEventListener('touchstart', e => startX = e.changedTouches[0].clientX, {passive:true});
    document.querySelector('#stage').addEventListener('touchend', e => { const dx=e.changedTouches[0].clientX-startX; if(Math.abs(dx)>50) show(current+(dx<0?1:-1)); }, {passive:true});
    show(0);
  </script>
</body>
</html>
